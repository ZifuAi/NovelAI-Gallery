<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg:#14161c; --surface:#1d212a; --surface-hi:#262b36; --border:#2c3240;
      --text:#eceef4; --dim:#a2a9bb; --faint:#6c7488;
      --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --accent:#8ba4ff;
    }
    body {
      width: 320px; margin: 0; padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      font-size: 13px; background: var(--bg); color: var(--text);
    }
    .head { display:flex; align-items:center; gap:9px; margin-bottom:13px; }
    .mark { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#8ba4ff,#c9a4ff); }
    h1 { font-size:13.5px; font-weight:600; margin:0; }

    .row {
      display:flex; align-items:flex-start; gap:8px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:10px 12px; margin-bottom:8px;
      line-height:1.5;
    }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0; margin-top:5px; }
    .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.16)}
    .dot.error{background:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.16)}
    .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.16)}
    .row .txt { flex:1; }
    .row .sub { color:var(--faint); font-size:11.5px; margin-top:3px; }

    .stat { display:flex; align-items:baseline; gap:7px; padding:2px; margin-bottom:10px; }
    .stat .num { font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; }
    .stat .lbl { color:var(--dim); font-size:12px; }

    .btn {
      display:block; width:100%; box-sizing:border-box;
      padding:9px 12px; margin-top:7px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:9px; color:var(--text);
      text-decoration:none; text-align:center; font-size:12.5px; cursor:pointer;
    }
    .btn:hover{background:var(--surface-hi)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e1a;font-weight:600}
    .btn.primary:hover{filter:brightness(1.08)}
    .btn:disabled{opacity:.55;cursor:default}
    .btn.stop{background:#3a2226;border-color:#5d2f36;color:#fca5a5}
    .btn.stop:hover{background:#472a2f}
    .btn.startup{background:#1e3326;border-color:#2f5d3c;color:#86efac}
    .btn.startup:hover{background:#274232}

    details { margin-top:11px; }
    summary { cursor:pointer; color:var(--faint); font-size:11.5px; outline:none; }
    summary:hover{color:var(--dim)}
    pre {
      margin:8px 0 0; padding:9px 10px;
      background:#0e1015; border:1px solid var(--border); border-radius:8px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:10.5px; line-height:1.55; color:var(--dim);
      white-space:pre-wrap; word-break:break-word;
      max-height:190px; overflow:auto;
    }
    .copy { margin-top:6px; }
  </style>
</head>
<body>
  <div class="head">
    <div class="mark"></div>
    <h1>NovelAI Gallery Sync</h1>
  </div>

  <div class="row">
    <span class="dot" id="appDot"></span>
    <div class="txt"><span id="appText">Checking…</span></div>
  </div>

  <div class="row">
    <span class="dot" id="pageDot"></span>
    <div class="txt">
      <span id="pageText">Checking NovelAI page…</span>
      <div class="sub" id="pageSub"></div>
    </div>
  </div>

  <div class="stat">
    <span class="num" id="captureCount">–</span>
    <span class="lbl">images in gallery</span>
  </div>

  <button class="btn" id="toggleBtn">…</button>
  <button class="btn primary" id="scanBtn">Import NovelAI history now</button>
  <a class="btn" id="openGallery" href="#" target="_blank">Open gallery</a>
  <button class="btn" id="openOptions">Settings</button>

  <details id="diagWrap">
    <summary>Diagnostics (share this if it isn't working)</summary>
    <pre id="diag">…</pre>
    <button class="btn copy" id="copyDiag">Copy diagnostics</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
